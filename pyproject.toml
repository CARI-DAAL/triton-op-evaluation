[project]
name = "triton-evaluation"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn==0.51.0",
    "redis==8.0.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "rfc8785==0.1.4",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "fakeredis==2.37.0", "httpx==0.28.1", "jsonschema==4.26.0"]
dev = ["ruff==0.16.0"]

[tool.setuptools.packages.find]
include = ["triton_evaluation*"]

[tool.pytest.ini_options]
markers = [
    "npu: requires a real Ascend NPU and a deployed service (production release gate)",
    "release_gate: orchestrated by scripts/npu_release_gate.py, never run standalone in CI",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# engine/ is vendored (Huawei, CANN license) — do not lint or reformat it.
extend-exclude = ["triton_evaluation/engine"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection defaults are calls in argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

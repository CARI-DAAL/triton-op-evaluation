[project]
name = "triton-evaluation"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "redis>=5.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "fakeredis>=2.21", "httpx>=0.27"]
dev = ["ruff>=0.16"]

[tool.setuptools.packages.find]
include = ["triton_evaluation*"]

[tool.ruff]
line-length = 100
target-version = "py310"
# engine/ is vendored (Huawei, CANN license) — do not lint or reformat it.
extend-exclude = ["triton_evaluation/engine"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection defaults are calls in argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

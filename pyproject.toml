[project]
name = "triton-evaluation"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn==0.51.0",
    "redis==8.0.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "rfc8785==0.1.4",
]

[project.optional-dependencies]
# Tensor/cache tests use the Torch-to-NumPy bridge; Torch does not install NumPy.
# Profiler CSV tests need pandas even on CPU-only CI hosts.
# Keep the test stack compatible across the Python 3.10–3.12 CI matrix.
test = ["pytest==9.1.1", "fakeredis==2.37.0", "httpx==0.28.1", "jsonschema==4.26.0", "numpy==2.2.6", "pandas==2.2.3"]
    # Full Ascend NPU stack — the single version declaration shared by BOTH
    # deployment paths: `pip install -e ".[npu]"` (host / scripts/start.sh)
    # and the Docker build. torch_npu / triton-ascend are not on PyPI; install
    # with --extra-index-url pointing at the Ascend wheel index. setproctitle
    # renames workers to `EvalWorker` in npu-smi; pyyaml is an undeclared
    # torch_npu import (npu/_memory_viz.py); pandas is needed by the engine.
    npu = [
        "torch==2.9.0",
        "torch_npu==2.9.0.post8",
        # Ascend's distribution supplies the triton module. Installing a
        # separate upstream triton wheel would overwrite that implementation.
        "triton-ascend==3.2.0",
        "pandas",
        "pyyaml",
        "setproctitle==1.3.7",
    ]
dev = ["ruff==0.16.0"]

[tool.setuptools.packages.find]
include = ["triton_evaluation*"]

[tool.setuptools.package-data]
"triton_evaluation.runtime" = ["INPUT_GENERATION_LICENSE"]

[tool.pytest.ini_options]
markers = [
    "npu: requires a real Ascend NPU and a deployed service (production release gate)",
    "release_gate: orchestrated by scripts/npu_release_gate.py, never run standalone in CI",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# engine/ is vendored (Huawei, CANN license) — do not lint or reformat it.
extend-exclude = ["triton_evaluation/engine"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Preserve existing formatting during runtime relocation. Deployments must
# regenerate the source SHA pins for these moved helpers before enabling reuse.
"triton_evaluation/runtime/sandbox.py" = ["I001"]
"triton_evaluation/runtime/reference_timing_reuse.py" = ["E501", "B905"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection defaults are calls in argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

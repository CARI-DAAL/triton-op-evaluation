name: Maintain release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: maintain-release-pr
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare version and changelog
        id: release
        run: >-
          python -m scripts.release_pr prepare
          --body-file "$RUNNER_TEMP/release-body.md"
          --output-file "$GITHUB_OUTPUT"
      - name: Check the preparation base
        if: steps.release.outputs.pending == 'true'
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ steps.release.outputs.base_sha }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          python -m scripts.release_pr check-base
          --base-sha "$BASE_SHA" --version "$RELEASE_VERSION" --repo "$GH_REPO"
          --output-file "$GITHUB_OUTPUT"
      - name: Keep the existing release PR in draft while updating
        if: steps.base.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ready_prs=$(gh pr list --repo "$GH_REPO" --head automation/release \
            --base main --state open --json number,isDraft \
            --jq '.[] | select(.isDraft == false) | .number')
          for number in $ready_prs; do
            gh pr ready "$number" --repo "$GH_REPO" --undo
          done
      - name: Maintain one release PR
        if: steps.base.outputs.current == 'true'
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/release
          base: main
          draft: always-true
          title: 'chore(release): v${{ steps.release.outputs.version }}'
          commit-message: 'chore(release): v${{ steps.release.outputs.version }}'
          body-path: ${{ runner.temp }}/release-body.md
          add-paths: |
            pyproject.toml
            CHANGELOG.md
      # Explicit dispatch attaches CI to the bot branch without a PAT or relying
      # on pull_request events generated by GITHUB_TOKEN.
      - name: Dispatch CPU CI for the release PR
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run evaluation-api-v2.yml --ref automation/release
      - name: Recheck main and the prepared PR head
        if: steps.pr.outputs.pull-request-number
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ steps.release.outputs.base_sha }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_PR: ${{ steps.pr.outputs.pull-request-number }}
          RELEASE_HEAD: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: >-
          python -m scripts.release_pr check-base
          --base-sha "$BASE_SHA" --version "$RELEASE_VERSION" --repo "$GH_REPO"
          --pr "$RELEASE_PR" --head-sha "$RELEASE_HEAD"
          --output-file "$GITHUB_OUTPUT"
      - name: Mark the current release PR ready for review
        if: steps.latest.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PR: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr ready "$RELEASE_PR" --repo "$GH_REPO"

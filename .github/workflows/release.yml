name: Publish release

on:
  pull_request:
    branches: [main]
    types: [closed]

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  checks: read

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'automation/release' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wait for CPU CI on the reviewed PR commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          run_id=$(gh run list --repo "$GH_REPO" --workflow evaluation-api-v2.yml \
            --commit "$RELEASE_HEAD" --event workflow_dispatch --limit 1 \
            --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ] || [ "$run_id" = null ]; then
            echo "::error::No dispatched CPU CI run exists for $RELEASE_HEAD. Dispatch CI for that commit before retrying."
            exit 1
          fi
          gh run watch "$run_id" --repo "$GH_REPO" --exit-status --interval 30
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the reviewed distribution metadata
        run: python -m pip install .
      - name: Publish the reviewed source release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$RELEASE_HEAD"
          python -m scripts.release_pr publish --repo "$GH_REPO" --reviewed-head "$RELEASE_HEAD"
      - name: Refresh pending changes after publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run release-pr.yml --ref main

# triton-evaluation on an Ascend host — runs the HOST's proven Python env inside the
# container (Plan A / "copy host env to docker"). The image supplies the base + /opt/triton-eval
# source + entrypoint; the actual Python stack (the kernelgym conda env + ~/.local user-site,
# where torch 2.9.0 / torch_npu / triton + ascend backend live) and the host CANN are
# bind-mounted, and PYTHON_BIN points the service at the kernelgym python.
#
# This sidesteps the image's own conda env, which diverged from the host and is missing the
# CANN-TBE + triton-ascend runtime deps (decorator/scipy/attrs/psutil/pybind11/...). Replicating
# the host env is the only reliable way to make the Ascend triton path work in-container today.
#
# DURABILITY (evaluation API v2): Redis runs `--appendonly yes --appendfsync always`;
# EXEC acknowledgement under appendfsync always is the first-2xx durability boundary —
# an accepted evaluation survives a container crash. Data lives in the named volume
# triton-eval-redis-v2; NEVER use `docker compose down -v` on this deployment.
# scripts/compose.sh up|start|restart runs scripts/deployment_preflight.py first and
# refuses to start when any check fails (gateway bind, image digests, secret/catalog,
# AOF flags). There is no weaker in-memory development fallback in this file.
#
# The API binds the one IPv4 gateway of Docker network kernel-agent-sandbox-net (exported
# by the wrapper as TRITON_EVAL_API_HOST), never loopback or wildcard. The eval image is
# a required digest reference (TRITON_EVAL_IMAGE) with no mutable default; the evaluator
# build recorded in Provenance equals that same immutable reference.
#
#   scripts/compose.sh up -d        # preflight, then compose up
#   scripts/compose.sh logs -f
#   python3 scripts/test_eval_service.py --url http://172.18.0.1:11907
#   scripts/compose.sh down         # keeps the redis volume

services:
  triton-eval:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Only relevant if you rebuild AND stop using the host env below. The host-env
        # bind-mount bypasses the image's conda env at runtime regardless of these.
        BASE_IMAGE: ${BASE_IMAGE:-quay.io/ascend/vllm-ascend:v0.22.1rc1-a3}
        TORCH_SPEC: ${TORCH_SPEC:-torch==2.9.0}
        TORCH_NPU_SPEC: ${TORCH_NPU_SPEC:-torch_npu==2.9.0}
        TRITON_SPEC: ${TRITON_SPEC:-triton==3.5.0}
        TRITON_ASCEND_SPEC: ${TRITON_ASCEND_SPEC:-triton-ascend==3.2.0}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
    # Immutable digest reference required at deploy time; preflight rejects tag-only
    # references and RepoDigest mismatches. No :latest fallback exists on purpose.
    image: ${TRITON_EVAL_IMAGE:?TRITON_EVAL_IMAGE must be a sha256 digest reference}
    command: ["all"]
    restart: unless-stopped
    depends_on: [redis]          # start redis first (host network; eval tolerates a brief gap)
    network_mode: host           # bind the API to the sandbox bridge gateway
    privileged: true             # required for NPU device access in-container (see note above)
    shm_size: "32gb"             # torch_npu needs a large /dev/shm
    environment:
      # Run the service with the HOST kernelgym python (replicate host env in docker).
      PYTHON_BIN: ${PYTHON_BIN:-/home/n84449292/miniconda3/envs/kernelgym/bin/python3}
      # user-site = ~/.local (torch 2.9.0 / torch_npu / triton + ascend backend), decoupled from
      # HOME so HOME can point at a writable dir for ascend/triton compile caches.
      PYTHONUSERBASE: ${PYTHONUSERBASE:-/home/n84449292/.local}
      HOME: /tmp
      TRITON_EVAL_REDIS_URL: ${TRITON_EVAL_REDIS_URL:-redis://127.0.0.1:6379/7}
      # The wrapper exports the preflight-validated gateway here; preflight rejects any
      # loopback/wildcard/multiple-gateway configuration before Compose runs.
      TRITON_EVAL_API_HOST: ${TRITON_EVAL_API_HOST:?preflight must export the validated gateway}
      TRITON_EVAL_API_PORT: "11907"
      TRITON_EVAL_CARDS: ${TRITON_EVAL_CARDS:-8,9,10,11,12,13,14,15}
      # Device memory each worker holds from startup so npu-smi shows it while idle.
      TRITON_EVAL_DEVICE_HOLD_MB: ${TRITON_EVAL_DEVICE_HOLD_MB:-64}
      # Sole evaluator_build used at admission and in Provenance; equals TRITON_EVAL_IMAGE
      # (or an explicitly reviewed git:<40-hex> dev build).
      TRITON_EVAL_EVALUATOR_BUILD: ${TRITON_EVAL_EVALUATOR_BUILD:?must equal the immutable image}
      # Whole-run engine budgets (deployment-tunable; see the K3 watchdog report).
      TRITON_EVAL_VERIFY_BUDGET_CAP_SECONDS: ${TRITON_EVAL_VERIFY_BUDGET_CAP_SECONDS:-1500}
      TRITON_EVAL_BENCHMARK_TIMEOUT_SECONDS: ${TRITON_EVAL_BENCHMARK_TIMEOUT_SECONDS:-600}
      TRITON_EVAL_CAPABILITY_FILE: /run/secrets/triton-eval
      TRITON_EVAL_CATALOG_ROOT: /srv/triton-eval-release
      TRITON_EVAL_CATALOG_MANIFEST: /srv/triton-eval-release/catalog.json
      CANN_SET_ENV_PATH: ${CANN_SET_ENV_PATH:-/home/canada_group_folder/CANN/9.0.0.0430/ascend-toolkit/set_env.sh}
      ASCEND_DRIVER_PATH: /usr/local/Ascend/driver                     # mounted from host
    devices:
      # shared Ascend control devices
      - /dev/davinci_manager
      - /dev/devmm_svm
      - /dev/hisi_hdc
      # one davinci device per physical card — keep in sync with TRITON_EVAL_CARDS
      - /dev/davinci8
      - /dev/davinci9
      - /dev/davinci10
      - /dev/davinci11
      - /dev/davinci12
      - /dev/davinci13
      - /dev/davinci14
      - /dev/davinci15
    volumes:
      # The host's working Python stack — kernelgym conda env + user-site (~/.local).
      - /home/n84449292/miniconda3:/home/n84449292/miniconda3:ro
      - /home/n84449292/.local:/home/n84449292/.local:ro
      # Host CANN (canada 9.0.0.0430, matches driver 25.5.0). Mounted at the same host path so
      # set_env.sh resolves. The base image's baked-in CANN is too old (rtGetDevMsg unsupported).
      - /home/canada_group_folder/CANN/9.0.0.0430:/home/canada_group_folder/CANN/9.0.0.0430
      - /usr/local/dcmi:/usr/local/dcmi
      # Full host driver (lib64/device/kernel/...). GE op-store init needs more than lib64.
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi
      - /etc/ascend_install.info:/etc/ascend_install.info
      # Fixed entrypoint: PYTHON_BIN + unset baked-in CANN vars + add arch lib64 (libhccl.so).
      # (A future image rebuild that COPYs this entrypoint would let you drop this mount.)
      - ./docker/entrypoint.sh:/usr/local/bin/entrypoint.sh
      - ./logs:/opt/triton-eval/logs
      # Caller-scoped opaque capabilities: mounted read-only, container sees only the path.
      - ${TRITON_EVAL_CAPABILITY_FILE:-/run/secrets/triton-eval}:/run/secrets/triton-eval:ro
      # Trusted release catalog (manifest + references): read-only, no dynamic registration.
      - ${TRITON_EVAL_CATALOG_ROOT:-/srv/triton-eval-release}:/srv/triton-eval-release:ro

  # Redis: the durable source of truth for evaluation API v2. Compose-managed so it
  # comes up with the service and survives reboot (restart: unless-stopped). AOF with
  # appendfsync always makes EXEC acknowledgement the durability boundary for accepted
  # evaluations; the named /data volume preserves them across container replacement.
  # Binds 127.0.0.1:6379 on the host network — the same address TRITON_EVAL_REDIS_URL
  # points at. The image is the pinned multi-platform index resolved 2026-08-13 with
  # `docker buildx imagetools inspect`; a Redis update requires recording a new exact
  # tag+index digest and rerunning the deployment/AOF tests.
  redis:
    image: docker.io/library/redis:7.4.10-alpine3.21@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    network_mode: host
    command:
      - redis-server
      - --bind
      - 127.0.0.1
      - --port
      - "6379"
      - --save
      - ""
      - --appendonly
      - "yes"
      - --appendfsync
      - always
      - --aof-use-rdb-preamble
      - "yes"
    volumes:
      - triton-eval-redis-v2:/data

volumes:
  triton-eval-redis-v2:

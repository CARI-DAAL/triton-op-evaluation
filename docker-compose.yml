# One independent v2.1 evaluation instance per host. Configure its private bind,
# cards and host runtime paths in docker.env; the consumer owns instance selection.
# AOF data survives container replacement. Never remove the named data volume.
# Start through scripts/compose.sh after exporting the same docker.env inputs.

services:
  triton-eval:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Same declared build as `docker build .`; versions live in pyproject [npu].
        # Keep the BASE_IMAGE default in sync with the Dockerfile ARG.
        BASE_IMAGE: ${BASE_IMAGE:-python:3.11}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
    # Immutable digest reference required at deploy time; preflight rejects tag-only
    # references and RepoDigest mismatches. No :latest fallback exists on purpose.
    image: ${TRITON_EVAL_IMAGE:?TRITON_EVAL_IMAGE must be a sha256 digest reference}
    command: ["all"]
    restart: unless-stopped
    depends_on: [redis]          # start redis first (host network; eval tolerates a brief gap)
    network_mode: host           # bind the configured private host address
    privileged: true             # required for NPU device access in-container (see note above)
    shm_size: "32gb"             # torch_npu needs a large /dev/shm
    environment:
      PYTHON_BIN: python3
      HOME: /tmp
      TRITON_EVAL_REDIS_URL: ${TRITON_EVAL_REDIS_URL:-redis://127.0.0.1:6379/7}
      TRITON_EVAL_REDIS_PREFIX: triton-eval:v2.1
      TRITON_EVAL_CANN_FINGERPRINT: ${TRITON_EVAL_CANN_FINGERPRINT:-}
      # Explicit private address; each host runs an independent API and Redis.
      TRITON_EVAL_API_HOST: ${TRITON_EVAL_API_HOST:?set the instance private IPv4 address}
      TRITON_EVAL_API_PORT: "11907"
      TRITON_EVAL_CARDS: ${TRITON_EVAL_CARDS:-0}
      # Device memory each worker holds from startup so npu-smi shows it while idle.
      TRITON_EVAL_DEVICE_HOLD_MB: ${TRITON_EVAL_DEVICE_HOLD_MB:-64}
      # The build identity is the image's sha256:<64-hex> digest, without its registry/name
      # (or an explicitly reviewed git:<40-hex> dev build).
      TRITON_EVAL_IMAGE: ${TRITON_EVAL_IMAGE}
      TRITON_EVAL_EVALUATOR_BUILD: ${TRITON_EVAL_EVALUATOR_BUILD:?must equal the image sha256 digest}
      # Whole-run engine budgets (deployment-tunable; see the K3 watchdog report).
      TRITON_EVAL_VERIFY_BUDGET_CAP_SECONDS: ${TRITON_EVAL_VERIFY_BUDGET_CAP_SECONDS:-1500}
      TRITON_EVAL_BENCHMARK_TIMEOUT_SECONDS: ${TRITON_EVAL_BENCHMARK_TIMEOUT_SECONDS:-600}
      TRITON_EVAL_TRIAL_RATE_LIMIT_PER_MINUTE: ${TRITON_EVAL_TRIAL_RATE_LIMIT_PER_MINUTE-60}
      TRITON_EVAL_TRUSTED_RATE_LIMIT_PER_MINUTE: ${TRITON_EVAL_TRUSTED_RATE_LIMIT_PER_MINUTE-60}
      TRITON_EVAL_TRIAL_MAX_INFLIGHT: ${TRITON_EVAL_TRIAL_MAX_INFLIGHT-4}
      TRITON_EVAL_TRUSTED_MAX_INFLIGHT: ${TRITON_EVAL_TRUSTED_MAX_INFLIGHT-4}
      TRITON_EVAL_SESSION_MAX_INFLIGHT: ${TRITON_EVAL_SESSION_MAX_INFLIGHT-2}
      TRITON_EVAL_ROLLOUT_CALLER_IDS: ${TRITON_EVAL_ROLLOUT_CALLER_IDS-[]}
      TRITON_EVAL_ROLLOUT_RATE_LIMIT_PER_MINUTE: ${TRITON_EVAL_ROLLOUT_RATE_LIMIT_PER_MINUTE-600}
      TRITON_EVAL_ROLLOUT_MAX_INFLIGHT: ${TRITON_EVAL_ROLLOUT_MAX_INFLIGHT-256}
      TRITON_EVAL_POISON_DEATH_THRESHOLD: ${TRITON_EVAL_POISON_DEATH_THRESHOLD-2}
      TRITON_EVAL_CARD_AFFINITY_AVOIDANCE: ${TRITON_EVAL_CARD_AFFINITY_AVOIDANCE-true}
      TRITON_EVAL_CANARY_BUDGET_SECONDS: ${TRITON_EVAL_CANARY_BUDGET_SECONDS-120}
      TRITON_EVAL_CANARY_INTERVAL_SECONDS: ${TRITON_EVAL_CANARY_INTERVAL_SECONDS-60}
      TRITON_EVAL_CARD_RESET_COMMAND: ${TRITON_EVAL_CARD_RESET_COMMAND-}
      TRITON_EVAL_CARD_RECOVERY_MAX_STEP: ${TRITON_EVAL_CARD_RECOVERY_MAX_STEP-2}
      TRITON_EVAL_CARD_RECOVERY_RETRY_SECONDS: ${TRITON_EVAL_CARD_RECOVERY_RETRY_SECONDS-300}
      TRITON_EVAL_CARD_CANARY_ON_STARTUP: ${TRITON_EVAL_CARD_CANARY_ON_STARTUP-true}
      TRITON_EVAL_VERDICT_CACHE_ENABLED: ${TRITON_EVAL_VERDICT_CACHE_ENABLED-true}
      TRITON_EVAL_VERDICT_CACHE_TTL_SECONDS: ${TRITON_EVAL_VERDICT_CACHE_TTL_SECONDS-604800}
      TRITON_EVAL_COMPILE_PRECHECK_ENABLED: ${TRITON_EVAL_COMPILE_PRECHECK_ENABLED-true}
      TRITON_EVAL_PRECHECK_BUDGET_SECONDS: ${TRITON_EVAL_PRECHECK_BUDGET_SECONDS-60}
      # Operator declarations from this host's actual inventory, recorded in provenance.
      TRITON_EVAL_WORKER_HARDWARE_MODEL: ${TRITON_EVAL_WORKER_HARDWARE_MODEL-Ascend910B3}
      TRITON_EVAL_WORKER_DRIVER_VERSION: ${TRITON_EVAL_WORKER_DRIVER_VERSION-24.1.0}
      TRITON_EVAL_WORKER_RUNTIME_VERSION: ${TRITON_EVAL_WORKER_RUNTIME_VERSION-8.0.RC3}
      TRITON_EVAL_WORKER_TOOLCHAIN_VERSION: ${TRITON_EVAL_WORKER_TOOLCHAIN_VERSION-CANN 8.0.RC3}
      TRITON_EVAL_CAPABILITY_SECRET_PATH: /run/secrets/triton-eval
      TRITON_EVAL_CATALOG_ROOT: /srv/triton-eval-release
      TRITON_EVAL_CATALOG_MANIFEST_PATH: /srv/triton-eval-release/catalog.json
      CANN_SET_ENV_PATH: /opt/cann/ascend-toolkit/set_env.sh
      ASCEND_DRIVER_PATH: /usr/local/Ascend/driver                     # mounted from host
    volumes:
      # The image contains the declared Python stack; only host CANN/driver is mounted.
      - ${CANN_HOST:-/usr/local/Ascend}:/opt/cann:ro
      - /usr/local/dcmi:/usr/local/dcmi
      # Full host driver (lib64/device/kernel/...). GE op-store init needs more than lib64.
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi
      - /etc/ascend_install.info:/etc/ascend_install.info
      - ./logs:/opt/triton-eval/logs
      # Caller-scoped opaque capabilities: mounted read-only, container sees only the path.
      - ${TRITON_EVAL_CAPABILITY_SECRET_PATH:-/run/secrets/triton-eval}:/run/secrets/triton-eval:ro
      # Trusted release catalog (manifest + references): read-only, no dynamic registration.
      - ${TRITON_EVAL_CATALOG_ROOT:-/srv/triton-eval-release}:/srv/triton-eval-release:ro

  # Redis: the durable source of truth for evaluation API v2. Compose-managed so it
  # comes up with the service and survives reboot (restart: unless-stopped). AOF with
  # appendfsync always makes EXEC acknowledgement the durability boundary for accepted
  # evaluations; the named /data volume preserves them across container replacement.
  # Binds 127.0.0.1:6379 on the host network — the same address TRITON_EVAL_REDIS_URL
  # points at. The image is the pinned multi-platform index resolved 2026-08-13 with
  # `docker buildx imagetools inspect`; a Redis update requires recording a new exact
  # tag+index digest and rerunning the deployment/AOF tests.
  redis:
    image: docker.io/library/redis:7.4.10-alpine3.21@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    network_mode: host
    command:
      - redis-server
      - --bind
      - 127.0.0.1
      - --port
      - "6379"
      - --save
      - ""
      - --appendonly
      - "yes"
      - --appendfsync
      - always
      - --aof-use-rdb-preamble
      - "yes"
    volumes:
      - triton-eval-redis-v2:/data

volumes:
  triton-eval-redis-v2:

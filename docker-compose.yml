# triton-evaluation on an Ascend host — manual device-mount (no ascend-docker-runtime),
# reusing the proven vllm-ascend scheme. CANN is baked in the base image; only the host
# DRIVER + NPU devices are mounted. Redis is the HOST's (via --network host); not bundled.
#
#   cp docker.env.example docker.env      # edit CARDS + redis
#   docker compose --env-file docker.env build
#   docker compose --env-file docker.env up -d
#
# NOTE: this compose assumes a SINGLE chip (TRITON_EVAL_CARDS). For multiple cards,
# add one `- /dev/davinciN` line per card under `devices:`.

services:
  triton-eval:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-quay.io/ascend/vllm-ascend:v0.22.1rc1-a3}
        TORCH_SPEC: ${TORCH_SPEC:-torch==2.9.0}
        TORCH_NPU_SPEC: ${TORCH_NPU_SPEC:-torch_npu==2.9.0}
        TRITON_SPEC: ${TRITON_SPEC:-triton==3.5.0}
        TRITON_ASCEND_SPEC: ${TRITON_ASCEND_SPEC:-triton-ascend==3.2.1}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
    image: triton-evaluation:latest
    command: ["all"]
    restart: unless-stopped
    network_mode: host           # reach the host's Redis at 127.0.0.1
    shm_size: "32gb"             # torch_npu needs a large /dev/shm
    environment:
      TRITON_EVAL_REDIS_URL: ${TRITON_EVAL_REDIS_URL:-redis://127.0.0.1:6379/0}
      TRITON_EVAL_API_HOST: 0.0.0.0
      TRITON_EVAL_API_PORT: ${TRITON_EVAL_API_PORT:-10907}
      TRITON_EVAL_CARDS: ${TRITON_EVAL_CARDS:-0}
      CANN_SET_ENV_PATH: /usr/local/Ascend/ascend-toolkit/set_env.sh   # baked in base image
      ASCEND_DRIVER_PATH: /usr/local/Ascend/driver                     # mounted from host
    devices:
      - /dev/davinci_manager
      - /dev/devmm_svm
      - /dev/hisi_hdc
      - /dev/davinci${TRITON_EVAL_CARDS:-0}      # the chip; MUST match TRITON_EVAL_CARDS
    volumes:
      - /usr/local/dcmi:/usr/local/dcmi
      - /usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64
      - /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info
      - /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi
      - /etc/ascend_install.info:/etc/ascend_install.info
      - ./logs:/opt/triton-eval/logs
